# Config do XcodeGen — gera o .xcodeproj no CI (xcodegen generate), nunca à
# mão no Xcode (ver PLANO.md seção 2.3). Não existe Mac nesta máquina de
# desenvolvimento, então este arquivo é a única "fonte da verdade" da
# estrutura do projeto — se algo precisa mudar no target/build settings, muda
# aqui, não num .xcodeproj que nem existe fora do CI.

name: ViralClip

options:
  # Versão mínima de sintaxe do project.yml que o XcodeGen entende — trava
  # comportamento pra não variar entre versões do XcodeGen no runner do CI.
  xcodeVersion: "15.0"
  deploymentTarget:
    iOS: "17.0"

# Pacote Swift local com a lógica pura (SilenceDetection etc.), desenvolvido
# e testado à parte no Windows via `swift test` (ver CLAUDE.md seção 2). O
# caminho é relativo à raiz do repo, onde este project.yml também vive. Este
# pacote pode ainda não existir neste worktree no momento em que este
# project.yml foi escrito — é escrito em paralelo por outro agente — mas o
# XcodeGen só resolve esse caminho na hora de `xcodegen generate` no CI,
# quando o merge já tiver acontecido.
packages:
  EditorCore:
    path: EditorCore

targets:
  ViralClip:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ViralClip
    dependencies:
      - package: EditorCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ruyter.viralclip
        # App SwiftUI puro, sem Storyboard/Info.plist manual — o XcodeGen
        # gera o Info.plist a partir destas chaves INFOPLIST_KEY_*.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Necessário pra salvar o vídeo cortado de volta na galeria
        # (PHPhotoLibrary, ver ViralClip/Pipeline/PhotoLibrarySaver.swift).
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Pra salvar o vídeo cortado de volta na sua galeria."
        # Acesso de LEITURA à biblioteca inteira (PHPhotoLibrary .readWrite,
        # ver ViralClip/Pipeline/PhotoAssetLoader.swift) — troca deliberada
        # em relação ao PhotosPicker padrão (que não pede permissão nenhuma,
        # mas sempre copia o arquivo inteiro antes de liberar qualquer
        # acesso). Com essa permissão, o vídeo é lido direto via
        # PHImageManager sem essa cópia forçada, que é a diferença real de
        # velocidade em vídeo grande. Custo: pede acesso à galeria inteira,
        # não só ao selecionado — aceitável pro escopo do projeto (uso
        # pessoal, só no aparelho do usuário, ver CLAUDE.md seção 0).
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pra abrir o vídeo escolhido rápido, sem copiar o arquivo inteiro primeiro."
        # Necessário pra transcrever o áudio do vídeo já cortado
        # (SFSpeechRecognizer, ver ViralClip/Pipeline/Transcriber.swift) e
        # gerar a legenda. Usa SFSpeechURLRecognitionRequest (arquivo, não
        # microfone ao vivo), então NÃO precisa de NSMicrophoneUsageDescription.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Pra transcrever a fala do vídeo e gerar a legenda automática."
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Propositalmente SEM CODE_SIGN_IDENTITY nem DEVELOPMENT_TEAM aqui —
        # a assinatura de verdade acontece depois, fora do CI, no AltServer
        # do lado do usuário (ver PLANO.md seção 2.2/2.4 e CLAUDE.md seção 7).
        # O workflow do GitHub Actions builda com
        # CODE_SIGNING_ALLOWED=NO/CODE_SIGNING_REQUIRED=NO justamente pra não
        # precisar de nenhuma configuração de assinatura aqui.
