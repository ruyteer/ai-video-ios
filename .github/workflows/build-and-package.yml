# Build de CI do ViralClip — compila pra device iOS real SEM NENHUM
# certificado/identidade de assinatura, e empacota um .ipa não assinado como
# artefato do workflow.
#
# Fluxo completo (o que acontece depois deste workflow, fora do GitHub):
#   1. Baixe o artefato "ViralClip-ipa" desta execução (aba Actions do repo).
#   2. Abra o Sideloadly (grátis, roda no Windows) no seu PC.
#   3. Conecte o iPhone via cabo USB, arraste o .ipa baixado pro Sideloadly.
#   4. Faça login com um Apple ID grátis (sem conta de desenvolvedor paga) —
#      o Sideloadly assina o .ipa localmente com esse Apple ID e instala.
#   5. Limitação real (ver PLANO.md seção 2.2/7): apps assinados por Apple ID
#      grátis expiram em 7 dias — repita os passos 1-4 toda semana.
#
# Por que não tem `-exportArchive` nem `xcodebuild archive` aqui: exportar um
# .xcarchive assinado exige um método de exportação (development/ad-hoc) que
# por sua vez exige identidade de assinatura/provisioning profile — exatamente
# o que este projeto não tem e não quer ter no CI (ver PLANO.md seção 2.2 e
# CLAUDE.md seção 7). Em vez disso, buildamos direto (sem archive) e montamos
# o .ipa manualmente: um .ipa não é nada além de um zip com a estrutura
# `Payload/NomeDoApp.app` dentro — não precisa de assinatura pra existir como
# arquivo, só pra rodar num device (isso o Sideloadly resolve depois).
#
# AVISO PRA QUEM MEXER AQUI NO FUTURO: NÃO adicione CODE_SIGN_IDENTITY,
# DEVELOPMENT_TEAM, nem nenhum secret de certificado/provisioning profile
# neste workflow. Isso desviaria da arquitetura decidida no PLANO.md — a
# assinatura é 100% responsabilidade do Sideloadly, do lado do usuário, fora
# do CI. Se um novo requisito parecer exigir isso, pare e confirme com o
# usuário antes de adicionar.

name: Build and Package

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar o .xcodeproj a partir do project.yml
        run: xcodegen generate

      - name: Build sem assinatura de código (device real)
        run: |
          xcodebuild build \
            -project ViralClip.xcodeproj \
            -scheme ViralClip \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Empacotar o .ipa (zip de Payload/ViralClip.app)
        run: |
          set -e
          APP_PATH="DerivedData/Build/Products/Debug-iphoneos/ViralClip.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Não achei $APP_PATH — build não gerou o .app esperado."
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r ViralClip.ipa Payload

      - name: Subir o .ipa como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: ViralClip-ipa
          path: ViralClip.ipa
